<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>墨戰 · 五分鐘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE3D2;
    --paper-deep:#DCD3BC;
    --ink:#1B1A17;
    --ink-soft:rgba(27,26,23,.55);
    --zhu:#BF3B2D;
    --dian:#33526E;
    --jin:#B08A3E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    user-select:none;touch-action:none;
  }
  .serif{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","MingLiU",serif}
  canvas{display:block;position:fixed;inset:0}

  .veil{
    position:fixed;inset:0;display:none;place-items:center;
    background:rgba(234,227,210,.82);backdrop-filter:blur(3px);
    z-index:10;padding:24px;
  }
  .veil.on{display:grid}

  /* ---- 開場 ---- */
  #start .plate{text-align:center;max-width:520px}
  .brush-title{
    font-size:clamp(64px,17vw,132px);line-height:.92;letter-spacing:.06em;
    font-weight:900;margin:0;
  }
  .brush-title span{display:inline-block}
  .seal{
    display:inline-grid;place-items:center;width:52px;height:52px;
    background:var(--zhu);color:#F4EFE2;border-radius:6px;
    font-size:26px;font-weight:700;transform:rotate(-4deg);
    box-shadow:2px 3px 0 rgba(27,26,23,.18);
  }
  .rule{height:2px;background:var(--ink);opacity:.85;margin:18px auto;width:70px}
  .lede{font-size:15px;line-height:1.9;color:var(--ink-soft);margin:0 0 6px}
  .keys{margin-top:22px;font-size:13px;letter-spacing:.12em;color:var(--ink-soft)}
  .go{
    margin-top:26px;display:inline-block;border:2px solid var(--ink);
    background:transparent;color:var(--ink);padding:13px 34px;font-size:17px;
    letter-spacing:.3em;cursor:pointer;font-weight:700;
    transition:background .15s,color .15s;
  }
  .go:hover,.go:focus-visible{background:var(--ink);color:var(--paper);outline:none}

  /* ---- 升級 ---- */
  #lvl .plate{width:100%;max-width:760px}
  .lvl-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
  .lvl-head h2{font-size:30px;margin:0;letter-spacing:.12em;font-weight:900}
  .lvl-head small{font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
  #cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{
    background:var(--paper);border:2px solid var(--ink);padding:18px 16px 16px;
    cursor:pointer;position:relative;transition:transform .12s,background .12s;
  }
  .card:hover,.card:focus-visible{transform:translateY(-4px);background:#F2ECDD;outline:none}
  .card .k{
    position:absolute;top:-13px;left:14px;width:26px;height:26px;background:var(--zhu);
    color:#F4EFE2;display:grid;place-items:center;font-size:14px;font-weight:700;border-radius:4px;
  }
  .card .n{font-size:20px;font-weight:900;letter-spacing:.06em;margin:4px 0 8px}
  .card .d{font-size:13px;line-height:1.75;color:var(--ink-soft);min-height:44px}
  .card .lv{margin-top:12px;font-size:12px;letter-spacing:.14em;color:var(--zhu);font-weight:700}
  @media(max-width:620px){
    #cards{grid-template-columns:1fr}
    .card .d{min-height:0}
    .card{padding:14px}
  }

  /* ---- 結算 ---- */
  #end .plate{text-align:center;width:100%;max-width:460px}
  .namebox{display:flex;gap:8px;justify-content:center;margin-top:22px}
  .namebox input{
    border:2px solid var(--ink);background:transparent;padding:11px 14px;
    font:inherit;font-size:16px;width:170px;color:var(--ink);border-radius:0;
  }
  .namebox input:focus{outline:none;border-color:var(--zhu)}
  .namebox .go{margin-top:0;padding:11px 22px;letter-spacing:.2em}
  .board{margin:24px 0 0;border-top:2px solid var(--ink);padding-top:6px;text-align:left}
  .board h3{
    font-size:13px;letter-spacing:.28em;margin:0 0 6px;color:var(--ink-soft);font-weight:600;
  }
  .row{
    display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:baseline;
    padding:7px 2px;border-bottom:1px solid rgba(27,26,23,.12);font-size:14px;
  }
  .row .rk{font-weight:900;color:var(--zhu);font-size:13px}
  .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tm{font-weight:800;font-variant-numeric:tabular-nums}
  .row .kl{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .row.me{background:rgba(191,59,45,.10);margin:0 -6px;padding-left:8px;padding-right:8px}
  .row .crown{color:var(--jin)}
  .muted{font-size:12px;line-height:1.8;color:var(--ink-soft);letter-spacing:.06em;margin:12px 0 0}
  .link{
    background:none;border:none;font:inherit;font-size:13px;color:var(--ink-soft);
    letter-spacing:.16em;cursor:pointer;text-decoration:underline;text-underline-offset:5px;
    padding:8px;margin-top:14px;
  }
  .link:hover{color:var(--zhu)}
  .ver{position:fixed;right:12px;bottom:10px;font-size:11px;letter-spacing:.14em;
       color:var(--ink-soft);opacity:.6;z-index:20;pointer-events:none}
  .verdict{font-size:clamp(58px,15vw,108px);margin:0;font-weight:900;letter-spacing:.15em}
  .verdict.lose{color:var(--ink)}
  .verdict.win{color:var(--zhu)}
  .stats{display:flex;gap:34px;justify-content:center;margin:26px 0 4px;flex-wrap:wrap}
  .stat b{display:block;font-size:32px;font-weight:900;letter-spacing:.04em}
  .stat span{font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="veil on" id="start">
  <div class="plate">
    <h1 class="brush-title serif"><span>墨</span><span>戰</span></h1>
    <div class="rule"></div>
    <p class="lede serif">你是一枚硃砂印。<br>紙上的墨正在漫開，要吞掉你。</p>
    <p class="lede">撐過五分鐘。</p>
    <button class="go serif" id="btnStart">起筆</button>
    <p class="keys">WASD／方向鍵移動 · 自動出筆 · 手機直接拖曳</p>
    <div><button class="link" id="btnPeek">觀榜</button></div>
  </div>
</div>

<div class="veil" id="lvl">
  <div class="plate">
    <div class="lvl-head">
      <h2 class="serif">添筆</h2><small>選一項　按 1 2 3 也行</small>
    </div>
    <div id="cards"></div>
  </div>
</div>

<div class="veil" id="end">
  <div class="plate">
    <h1 class="verdict serif" id="verdict">墨盡</h1>
    <div class="stats">
      <div class="stat"><b id="sTime">0:00</b><span>撐住</span></div>
      <div class="stat"><b id="sKill">0</b><span>化開的墨</span></div>
      <div class="stat"><b id="sLv">1</b><span>筆力</span></div>
    </div>
    <div class="namebox" id="nameBox">
      <input id="nameIn" maxlength="8" placeholder="留個名號" autocomplete="off" spellcheck="false">
      <button class="go serif" id="btnPost">上榜</button>
    </div>
    <div class="board">
      <h3 id="boardTitle">榜　單</h3>
      <div id="rows"></div>
      <p class="muted" id="boardMsg">讀取中…</p>
    </div>
    <button class="go serif" id="btnAgain">再來</button>
  </div>
</div>
<div class="ver" id="verTag"></div>

<script>
(() => {
"use strict";

const VER = "v0.4";
document.getElementById("verTag").textContent = VER;

// ─────────────────────────── 畫布 ───────────────────────────
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W * DPR); cvs.height = Math.floor(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const C = {
  paper:'#EAE3D2', paperDeep:'#DCD3BC', ink:'#1B1A17',
  zhu:'#BF3B2D', dian:'#33526E', jin:'#B08A3E', tai:'#5C7A4A'
};

// 紙紋（畫一次，之後平鋪）
const paperPat = (() => {
  const s = 200, o = document.createElement('canvas');
  o.width = o.height = s;
  const g = o.getContext('2d');
  g.fillStyle = C.paper; g.fillRect(0,0,s,s);
  for (let i=0;i<2600;i++){
    g.fillStyle = `rgba(27,26,23,${Math.random()*0.045})`;
    g.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
  for (let i=0;i<26;i++){                    // 紙纖維
    g.strokeStyle = `rgba(27,26,23,${0.02+Math.random()*0.03})`;
    g.lineWidth = 0.6 + Math.random();
    g.beginPath();
    const y = Math.random()*s;
    g.moveTo(0, y);
    g.bezierCurveTo(s*0.3, y+Math.random()*8-4, s*0.6, y+Math.random()*8-4, s, y+Math.random()*6-3);
    g.stroke();
  }
  return ctx.createPattern(o, 'repeat');
})();

// ─────────────────────────── 輸入 ───────────────────────────
const keys = Object.create(null);
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if (state === 'levelup' && '123'.includes(k)) {
    const i = +k - 1;
    if (pendingCards[i]) choose(pendingCards[i]);
  }
  if (state === 'menu' && (k === 'enter' || k === ' ')) begin();
  if ((state === 'over' || state === 'win') && (k === 'enter' || k === 'r')) begin();
  if (state === 'play' && (k === 'escape' || k === 'p')) paused = !paused;
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// 觸控搖桿：按住畫面任一處拖曳
let touchId = null, tStart = {x:0,y:0}, tCur = {x:0,y:0};
cvs.addEventListener('touchstart', e => {
  if (touchId !== null) return;
  const t = e.changedTouches[0];
  touchId = t.identifier;
  tStart = {x:t.clientX, y:t.clientY};
  tCur = {...tStart};
  e.preventDefault();
}, {passive:false});
cvs.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) if (t.identifier === touchId) tCur = {x:t.clientX, y:t.clientY};
  e.preventDefault();
}, {passive:false});
const endTouch = e => {
  for (const t of e.changedTouches) if (t.identifier === touchId) touchId = null;
};
cvs.addEventListener('touchend', endTouch);
cvs.addEventListener('touchcancel', endTouch);

function moveAxis(){
  let ax = 0, ay = 0;
  if (keys['a'] || keys['arrowleft'])  ax -= 1;
  if (keys['d'] || keys['arrowright']) ax += 1;
  if (keys['w'] || keys['arrowup'])    ay -= 1;
  if (keys['s'] || keys['arrowdown'])  ay += 1;
  if (touchId !== null){
    const dx = tCur.x - tStart.x, dy = tCur.y - tStart.y;
    const d = Math.hypot(dx, dy);
    if (d > 8){ const m = Math.min(d, 60) / 60; ax = dx/d*m; ay = dy/d*m; }
  }
  const l = Math.hypot(ax, ay);
  return l > 1 ? {x:ax/l, y:ay/l} : {x:ax, y:ay};
}

// ─────────────────────────── 狀態 ───────────────────────────
const UI = {
  start: document.getElementById('start'),
  lvl:   document.getElementById('lvl'),
  end:   document.getElementById('end'),
  cards: document.getElementById('cards'),
  verdict: document.getElementById('verdict'),
  sTime: document.getElementById('sTime'),
  sKill: document.getElementById('sKill'),
  sLv:   document.getElementById('sLv'),
  nameBox: document.getElementById('nameBox'),
  nameIn:  document.getElementById('nameIn'),
  btnPost: document.getElementById('btnPost'),
  btnAgain:document.getElementById('btnAgain'),
  rows:    document.getElementById('rows'),
  boardMsg:document.getElementById('boardMsg'),
  boardTitle: document.getElementById('boardTitle')
};
const showVeil = el => { for (const k of ['start','lvl','end']) UI[k].classList.toggle('on', UI[k] === el); };
const hideVeils = () => { for (const k of ['start','lvl','end']) UI[k].classList.remove('on'); };

let state = 'menu', paused = false;
let p, enemies, bullets, foeShots, orbs, motes, novas, big;
let T, kills, spawnT, shake, shakeT, bossQueue, camX, camY;
let pendingCards = [];
let banner = null;
const GOAL = 300; // 五分鐘

const UPGRADES = [
  {id:'dmg',   name:'濃墨',   desc:'每一筆的傷害提高 20%。',            max:8, apply:()=>p.dmgMul *= 1.2},
  {id:'rate',  name:'疾筆',   desc:'出筆間隔縮短 12%。',                max:8, apply:()=>p.cdMul *= 0.88},
  {id:'multi', name:'分岔',   desc:'同時多射出一道筆鋒。',              max:4, apply:()=>p.shots += 1},
  {id:'pierce',name:'透紙',   desc:'筆鋒可多穿透一個目標。',            max:3, apply:()=>p.pierce += 1},
  {id:'speed', name:'輕身',   desc:'移動速度提高 9%。',                 max:5, apply:()=>p.spd *= 1.09},
  {id:'hp',    name:'厚印',   desc:'生命上限 +25，並回滿。',            max:5, apply:()=>{p.maxHp += 25; p.hp = p.maxHp;}},
  {id:'regen', name:'滋潤',   desc:'每秒回復 0.7 點生命。',             max:5, apply:()=>p.regen += 0.7},
  {id:'magnet',name:'吸墨',   desc:'拾取範圍擴大 55%。',                max:4, apply:()=>p.pick *= 1.55},
  {id:'blade', name:'迴筆',   desc:'多一支繞身旋轉的筆，持續劃傷。',    max:4, apply:()=>p.blades += 1},
  {id:'nova',  name:'潑墨',   desc:'定時向四周炸開一圈朱墨。',          max:4, apply:()=>{p.nova += 1; p.novaT = 0.5;}}
];

function reset(){
  p = {
    x:0, y:0, r:14, hp:100, maxHp:100, spd:190,
    lv:1, xp:0, need:5, pending:0,
    dmgMul:1, cdMul:1, shots:1, pierce:0, regen:0, pick:120,
    blades:0, bladeAng:0, nova:0, novaT:0,
    cd:0, iframe:0, aim:-Math.PI/2, tilt:0,
    up:Object.fromEntries(UPGRADES.map(u=>[u.id,0]))
  };
  enemies=[]; bullets=[]; foeShots=[]; orbs=[]; motes=[]; novas=[]; big=[];
  T=0; kills=0; spawnT=0.6; shake=0; shakeT=0; camX=0; camY=0; paused=false;
  bossQueue = [85, 160, 225, 278];
}

function begin(){ reset(); hideVeils(); state='play'; }
document.getElementById('btnStart').onclick = begin;
document.getElementById('btnAgain').onclick = begin;

// ─────────────────────────── 敵人 ───────────────────────────
const TYPES = {
  blot:  {hp:20, spd:82,  r:13, dmg:9,  xp:1, col:C.ink,  lobes:5},
  spray: {hp:13, spd:152, r:9,  dmg:6,  xp:1, col:C.dian, lobes:4},
  slab:  {hp:95, spd:56,  r:22, dmg:17, xp:4, col:C.ink,  lobes:7},
  nib:   {hp:34, spd:66,  r:14, dmg:10, xp:3, col:C.dian, lobes:5, shoot:2.2},
  boss:  {hp:1150, spd:64, r:44, dmg:26, xp:45, col:C.ink, lobes:9, shoot:1.5, boss:true}
};

function makeLobes(n){
  const a = [];
  for (let i=0;i<n;i++) a.push({
    a: (i/n)*Math.PI*2 + Math.random()*0.5,
    d: 0.15 + Math.random()*0.45,
    s: 0.42 + Math.random()*0.34,
    w: Math.random()*Math.PI*2
  });
  return a;
}

function spawnEnemy(kind){
  const t = TYPES[kind];
  const ang = Math.random()*Math.PI*2;
  const dist = Math.hypot(W,H)/2 + 90;
  const scale = 1 + T*0.012;
  const e = {
    kind, x: p.x + Math.cos(ang)*dist, y: p.y + Math.sin(ang)*dist,
    r: t.r, hp: t.hp*scale, maxHp: t.hp*scale, spd: t.spd*(0.9+Math.random()*0.2),
    dmg: t.dmg, xp: t.xp, col: t.col, boss: !!t.boss,
    lobes: makeLobes(t.lobes), flash:0, wob: Math.random()*10,
    shootT: t.shoot ? Math.random()*t.shoot : 0, shoot: t.shoot||0,
    kx:0, ky:0
  };
  if (e.boss){ e.hp = e.maxHp = t.hp*(1+T*0.010); big.push(e); }
  enemies.push(e);
  return e;
}

function pickKind(){
  const r = Math.random();
  if (T > 130 && r < 0.14) return 'nib';
  if (T > 70  && r < 0.26) return 'slab';
  if (T > 25  && r < 0.46) return 'spray';
  return 'blot';
}

// ─────────────────────────── 空間網格 ───────────────────────────
const CELL = 60;
const grid = new Map();
const gkey = (cx,cy) => ((cx + 4096) << 13) | (cy + 4096);
function buildGrid(){
  grid.clear();
  for (const e of enemies){
    if (e.boss) continue;
    const k = gkey(Math.floor(e.x/CELL), Math.floor(e.y/CELL));
    let a = grid.get(k); if (!a){ a=[]; grid.set(k,a); }
    a.push(e);
  }
}
const scratch = [];
function nearby(x, y, pad){
  scratch.length = 0;
  const cx = Math.floor(x/CELL), cy = Math.floor(y/CELL);
  const rng = Math.max(1, Math.ceil(pad/CELL));
  for (let i=-rng;i<=rng;i++) for (let j=-rng;j<=rng;j++){
    const a = grid.get(gkey(cx+i, cy+j));
    if (a) for (const e of a) scratch.push(e);
  }
  for (const b of big) scratch.push(b);
  return scratch;
}

// ─────────────────────────── 特效 ───────────────────────────
function splat(x, y, n, col, pow){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = (0.3+Math.random())*pow;
    motes.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r:1+Math.random()*3.4, life:0.35+Math.random()*0.5, t:0, col});
  }
}
function kick(m){ shake = Math.max(shake, m); shakeT = 0.22; }

// ─────────────────────────── 升級 ───────────────────────────
function offerUpgrades(){
  const pool = UPGRADES.filter(u => p.up[u.id] < u.max);
  if (!pool.length){ p.hp = Math.min(p.maxHp, p.hp + 30); p.pending--; return; }
  const copy = pool.slice(), pick = [];
  while (pick.length < 3 && copy.length) pick.push(copy.splice(Math.random()*copy.length|0, 1)[0]);
  UI.cards.innerHTML = '';
  pick.forEach((u, i) => {
    const d = document.createElement('div');
    d.className = 'card'; d.tabIndex = 0;
    d.innerHTML = `<div class="k serif">${i+1}</div>
      <div class="n serif">${u.name}</div>
      <div class="d">${u.desc}</div>
      <div class="lv">${p.up[u.id]} → ${p.up[u.id]+1}　／　上限 ${u.max}</div>`;
    d.onclick = () => choose(u);
    d.onkeydown = ev => { if (ev.key === 'Enter') choose(u); };
    UI.cards.appendChild(d);
  });
  pendingCards = pick;
  showVeil(UI.lvl);
  state = 'levelup';
}
function choose(u){
  u.apply(); p.up[u.id]++; p.pending--;
  pendingCards = [];
  if (p.pending > 0) offerUpgrades();
  else { hideVeils(); state = 'play'; }
}

// ─────────────────────────── 更新 ───────────────────────────
function update(dt){
  T += dt;
  if (T >= GOAL) return finish(true);

  // 移動
  const mv = moveAxis();
  p.x += mv.x * p.spd * dt;
  p.y += mv.y * p.spd * dt;
  p.tilt += ((mv.x * 0.22) - p.tilt) * Math.min(1, dt*8);
  p.iframe = Math.max(0, p.iframe - dt);
  if (p.regen) p.hp = Math.min(p.maxHp, p.hp + p.regen*dt);

  // 生成
  spawnT -= dt;
  if (spawnT <= 0 && enemies.length < 210){
    spawnT = Math.max(0.38, 0.92 - T*0.0018);
    const n = 1 + Math.floor(T/95);
    for (let i=0;i<n;i++) spawnEnemy(pickKind());
  }
  if (bossQueue.length && T >= bossQueue[0]){
    bossQueue.shift();
    spawnEnemy('boss'); kick(16); banner = {text:'巨墨　來了', t:0};
  }

  // 自動出筆
  p.cd -= dt;
  let target = null, best = 640*640;
  for (const e of enemies){
    const d = (e.x-p.x)**2 + (e.y-p.y)**2;
    if (d < best){ best = d; target = e; }
  }
  if (target) p.aim = Math.atan2(target.y-p.y, target.x-p.x);
  if (p.cd <= 0 && target){
    p.cd = 0.45 * p.cdMul;
    const spread = 0.17 * (p.shots-1);
    for (let i=0;i<p.shots;i++){
      const a = p.aim - spread/2 + (p.shots>1 ? spread*i/(p.shots-1) : 0);
      bullets.push({x:p.x, y:p.y, vx:Math.cos(a)*570, vy:Math.sin(a)*570,
        r:6, dmg:14*p.dmgMul, life:1.1, pierce:p.pierce, hit:new Set(), a});
    }
    splat(p.x + Math.cos(p.aim)*16, p.y + Math.sin(p.aim)*16, 3, C.zhu, 40);
  }

  // 迴筆
  if (p.blades) p.bladeAng += dt * 2.5;

  // 潑墨
  if (p.nova){
    p.novaT -= dt;
    if (p.novaT <= 0){
      p.novaT = Math.max(1.8, 6 - p.nova*0.9);
      novas.push({x:p.x, y:p.y, r:0, max:150 + p.nova*45, dmg:22*p.nova*p.dmgMul, hit:new Set(), t:0});
      kick(5);
    }
  }
  for (let i=novas.length-1;i>=0;i--){
    const n = novas[i];
    n.t += dt; n.r = n.max * Math.min(1, n.t/0.45);
    if (n.t > 0.55) novas.splice(i,1);
  }

  buildGrid();

  // 子彈
  for (let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    let dead = b.life <= 0;
    if (!dead){
      for (const e of nearby(b.x, b.y, 30)){
        if (b.hit.has(e)) continue;
        const rr = e.r + b.r;
        if ((e.x-b.x)**2 + (e.y-b.y)**2 < rr*rr){
          hurt(e, b.dmg, b.vx, b.vy);
          b.hit.add(e);
          if (b.pierce-- <= 0){ dead = true; break; }
        }
      }
    }
    if (dead) bullets.splice(i,1);
  }

  // 敵人
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    let dx = p.x-e.x, dy = p.y-e.y, d = Math.hypot(dx,dy) || 1;
    if (d > 1500 && !e.boss){
      const a = Math.random()*Math.PI*2, ring = Math.hypot(W,H)/2 + 70;
      e.x = p.x + Math.cos(a)*ring; e.y = p.y + Math.sin(a)*ring;
      dx = p.x-e.x; dy = p.y-e.y; d = Math.hypot(dx,dy) || 1;
    }
    e.x += (dx/d)*e.spd*dt + e.kx*dt;
    e.y += (dy/d)*e.spd*dt + e.ky*dt;
    e.kx *= Math.pow(0.0008, dt); e.ky *= Math.pow(0.0008, dt);
    e.flash = Math.max(0, e.flash - dt*4);
    e.wob += dt;

    if (e.shoot){
      e.shootT -= dt;
      if (e.shootT <= 0 && d < 720){
        e.shootT = e.shoot;
        const n = e.boss ? 10 : 1;
        for (let k=0;k<n;k++){
          const a = e.boss ? (k/n)*Math.PI*2 + e.wob : Math.atan2(dy,dx);
          foeShots.push({x:e.x, y:e.y, vx:Math.cos(a)*225, vy:Math.sin(a)*225, r:7, dmg:e.boss?14:9, life:3.4});
        }
      }
    }

    // 分離：避免疊成一團
    for (const o of nearby(e.x, e.y, e.r+16)){
      if (o === e) continue;
      const ox = e.x-o.x, oy = e.y-o.y, od = Math.hypot(ox,oy);
      const min = (e.r+o.r)*0.82;
      if (od > 0.01 && od < min){
        const push = (min-od)/min * 42 * dt;
        e.x += (ox/od)*push; e.y += (oy/od)*push;
      }
    }

    // 迴筆命中
    if (p.blades){
      for (let k=0;k<p.blades;k++){
        const a = p.bladeAng + (k/p.blades)*Math.PI*2;
        const bx = p.x + Math.cos(a)*74, by = p.y + Math.sin(a)*74;
        const rr = e.r + 11;
        if ((e.x-bx)**2 + (e.y-by)**2 < rr*rr && (e.bladeCd||0) <= 0){
          e.bladeCd = 0.4;
          hurt(e, 13*p.dmgMul, e.x-bx, e.y-by);
        }
      }
    }
    if (e.bladeCd) e.bladeCd -= dt;

    // 潑墨命中
    for (const n of novas){
      if (n.hit.has(e)) continue;
      const rr = n.r + e.r;
      if ((e.x-n.x)**2 + (e.y-n.y)**2 < rr*rr){ n.hit.add(e); hurt(e, n.dmg, e.x-n.x, e.y-n.y); }
    }

    // 撞到印
    if (p.iframe <= 0){
      const rr = e.r + p.r;
      if ((e.x-p.x)**2 + (e.y-p.y)**2 < rr*rr) damagePlayer(e.dmg);
    }

    if (e.hp <= 0){
      kills++;
      splat(e.x, e.y, e.boss?46:10, e.col, e.boss?260:120);
      for (let k=0;k<(e.boss?12:1);k++)
        orbs.push({x:e.x+(Math.random()-0.5)*e.r, y:e.y+(Math.random()-0.5)*e.r,
                   v:e.boss?4:e.xp, vx:0, vy:0, t:Math.random()*6});
      if (e.boss){ kick(22); const bi = big.indexOf(e); if (bi>=0) big.splice(bi,1); }
      enemies.splice(i,1);
    }
  }

  // 敵彈
  for (let i=foeShots.length-1;i>=0;i--){
    const s = foeShots[i];
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    const rr = s.r + p.r;
    if (p.iframe <= 0 && (s.x-p.x)**2 + (s.y-p.y)**2 < rr*rr){ damagePlayer(s.dmg); s.life = 0; }
    if (s.life <= 0) foeShots.splice(i,1);
  }

  // 墨珠
  for (let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];
    o.t += dt;
    let dx = p.x-o.x, dy = p.y-o.y, d = Math.hypot(dx,dy) || 1;
    if (d >= p.pick){ o.x += (dx/d)*112*dt; o.y += (dy/d)*112*dt; }
    if (d < p.pick){
      const sp = 150 + (1 - d/p.pick) * 620;   // 越近吸得越快，必定追得上
      o.x += (dx/d)*sp*dt; o.y += (dy/d)*sp*dt;
      dx = p.x-o.x; dy = p.y-o.y; d = Math.hypot(dx,dy) || 1;
    }
    if (d < p.r + 14){
      p.xp += o.v; orbs.splice(i,1);
      while (p.xp >= p.need){
        p.xp -= p.need; p.lv++; p.need = 5 + p.lv*3; p.pending++;
      }
    }
  }
  if (p.pending > 0 && state === 'play') offerUpgrades();

  // 碎墨
  for (let i=motes.length-1;i>=0;i--){
    const m = motes[i];
    m.t += dt;
    m.x += m.vx*dt; m.y += m.vy*dt;
    m.vx *= Math.pow(0.02, dt); m.vy *= Math.pow(0.02, dt);
    if (m.t >= m.life) motes.splice(i,1);
  }

  if (banner){ banner.t += dt; if (banner.t > 2.2) banner = null; }

  // 鏡頭
  camX += (p.x - camX) * Math.min(1, dt*6);
  camY += (p.y - camY) * Math.min(1, dt*6);
  if (shakeT > 0){ shakeT -= dt; shake *= Math.pow(0.02, dt); } else shake = 0;
}

function hurt(e, dmg, kx, ky){
  e.hp -= dmg;
  e.flash = 1;
  const d = Math.hypot(kx, ky) || 1;
  const k = e.boss ? 12 : 90;
  e.kx += (kx/d)*k; e.ky += (ky/d)*k;
  splat(e.x, e.y, 2, e.col, 60);
}

function damagePlayer(dmg){
  if (state !== 'play') return;
  p.hp -= dmg;
  p.iframe = 0.85;
  kick(11);
  splat(p.x, p.y, 12, C.zhu, 150);
  if (p.hp <= 0){ p.hp = 0; finish(false); }
}

function finish(won){
  if (state !== 'play') return;
  state = won ? 'win' : 'over';
  UI.verdict.textContent = won ? '留白' : '墨盡';
  UI.verdict.className = 'verdict serif ' + (won ? 'win' : 'lose');
  UI.sTime.textContent = fmt(Math.min(T, GOAL));
  UI.sKill.textContent = kills;
  UI.sLv.textContent = p.lv;
  lastRun = {survived: Math.min(T, GOAL), kills, level: p.lv};
  myId = null; posting = false;
  UI.nameBox.style.display = 'flex';
  UI.btnPost.disabled = false;
  UI.btnPost.textContent = '上榜';
  UI.btnAgain.textContent = '再來';
  UI.rows.innerHTML = '';
  showVeil(UI.end);
  loadBoard();
}
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

// ─────────────────────────── 榜單 ───────────────────────────
const API = '/api/scores';
let lastRun = null, myId = null, posting = false;

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderBoard(top){
  UI.rows.innerHTML = '';
  if (!top.length){ UI.boardMsg.textContent = '還沒有人上榜。第一個就是你。'; return; }
  top.slice(0, 10).forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'row' + (r.id === myId ? ' me' : '');
    d.innerHTML = `<div class="rk${i===0?' crown':''}">${i+1}</div>
      <div class="nm">${esc(r.name)}${r.won ? ' <span class="crown">留白</span>' : ''}</div>
      <div class="tm">${fmt(r.survived)}</div>
      <div class="kl">${r.kills} 墨</div>`;
    UI.rows.appendChild(d);
  });
  UI.boardMsg.textContent = '';
}

async function loadBoard(){
  UI.boardMsg.textContent = '讀取中…';
  try {
    const res = await fetch(API, {cache:'no-store'});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '');
    renderBoard(data.top);
  } catch {
    UI.rows.innerHTML = '';
    UI.boardMsg.textContent = '榜單連不上——本機預覽時是正常的，部署到 Cloudflare Pages 並綁好 D1 之後就會有。';
  }
}

async function postScore(){
  if (posting || !lastRun) return;
  const name = UI.nameIn.value.trim();
  if (!name){ UI.nameIn.focus(); return; }
  posting = true;
  UI.btnPost.disabled = true;
  UI.btnPost.textContent = '送出中';
  try {
    const res = await fetch(API, {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({name, ...lastRun})
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '');
    myId = data.id;
    UI.nameBox.style.display = 'none';
    renderBoard(data.top);
  } catch (e) {
    UI.boardMsg.textContent = '沒送出去：' + (e.message || '連線失敗');
    UI.btnPost.disabled = false;
    UI.btnPost.textContent = '上榜';
  }
  posting = false;
}

UI.btnPost.onclick = postScore;
UI.nameIn.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); postScore(); } });

document.getElementById('btnPeek').onclick = () => {
  lastRun = null; myId = null;
  UI.verdict.textContent = '榜'; UI.verdict.className = 'verdict serif win';
  UI.sTime.textContent = '—'; UI.sKill.textContent = '—'; UI.sLv.textContent = '—';
  UI.nameBox.style.display = 'none';
  UI.btnAgain.textContent = '起筆';
  showVeil(UI.end);
  state = 'menu';
  loadBoard();
};

// ─────────────────────────── 繪製 ───────────────────────────
function inkBlob(x, y, r, lobes, wob, col, alpha){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r*0.86, 0, Math.PI*2);
  for (const l of lobes){
    const ox = x + Math.cos(l.a + Math.sin(wob*0.7 + l.w)*0.12) * r * l.d;
    const oy = y + Math.sin(l.a + Math.sin(wob*0.7 + l.w)*0.12) * r * l.d;
    const rr = r * l.s * (0.92 + Math.sin(wob*1.5 + l.w)*0.08);
    ctx.moveTo(ox + rr, oy);
    ctx.arc(ox, oy, rr, 0, Math.PI*2);
  }
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = paperPat;
  ctx.fillRect(0, 0, W, H);

  const sx = shake ? (Math.random()-0.5)*shake : 0;
  const sy = shake ? (Math.random()-0.5)*shake : 0;
  const ox = W/2 - camX + sx, oy = H/2 - camY + sy;
  ctx.save();
  ctx.translate(ox, oy);

  // 稿紙界格
  const g = 96;
  ctx.strokeStyle = 'rgba(51,82,110,.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const x0 = Math.floor((camX - W/2)/g)*g, x1 = camX + W/2 + g;
  const y0 = Math.floor((camY - H/2)/g)*g, y1 = camY + H/2 + g;
  for (let x=x0;x<x1;x+=g){ ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y=y0;y<y1;y+=g){ ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();

  // 墨珠
  for (const o of orbs){
    const b = 3.2 + Math.sin(o.t*5)*0.4 + Math.min(3, o.v);
    ctx.beginPath(); ctx.arc(o.x, o.y, b, 0, Math.PI*2);
    ctx.fillStyle = C.ink; ctx.globalAlpha = .85; ctx.fill();
    ctx.beginPath(); ctx.arc(o.x - b*0.3, o.y - b*0.3, b*0.3, 0, Math.PI*2);
    ctx.fillStyle = C.paper; ctx.globalAlpha = .55; ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 潑墨圈
  for (const n of novas){
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.strokeStyle = C.zhu;
    ctx.globalAlpha = Math.max(0, 1 - n.t/0.55) * 0.75;
    ctx.lineWidth = 10 * (1 - n.t/0.6);
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  // 敵彈
  for (const s of foeShots){
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = C.dian; ctx.globalAlpha = .9; ctx.fill(); ctx.globalAlpha = 1;
  }

  // 敵人
  for (const e of enemies){
    inkBlob(e.x, e.y, e.r, e.lobes, e.wob, e.flash > 0 ? C.zhu : e.col, e.boss ? 0.95 : 0.88);
    if (e.boss){
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r*1.25, 0, Math.PI*2);
      ctx.strokeStyle = C.jin; ctx.lineWidth = 2.5; ctx.globalAlpha = .8; ctx.stroke(); ctx.globalAlpha = 1;
      const w = 92, hp = Math.max(0, e.hp/e.maxHp);
      ctx.fillStyle = 'rgba(27,26,23,.18)'; ctx.fillRect(e.x-w/2, e.y-e.r*1.25-16, w, 5);
      ctx.fillStyle = C.jin; ctx.fillRect(e.x-w/2, e.y-e.r*1.25-16, w*hp, 5);
    }
  }

  // 迴筆
  if (p.blades) for (let k=0;k<p.blades;k++){
    const a = p.bladeAng + (k/p.blades)*Math.PI*2;
    const bx = p.x + Math.cos(a)*74, by = p.y + Math.sin(a)*74;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(a + Math.PI/2);
    ctx.beginPath();
    ctx.moveTo(0, -13); ctx.quadraticCurveTo(6, 0, 0, 13); ctx.quadraticCurveTo(-6, 0, 0, -13);
    ctx.fillStyle = C.ink; ctx.globalAlpha = .8; ctx.fill(); ctx.globalAlpha = 1;
    ctx.restore();
  }

  // 筆鋒（子彈）
  ctx.lineCap = 'round';
  for (const b of bullets){
    const tx = b.x - b.vx*0.026, ty = b.y - b.vy*0.026;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = C.zhu; ctx.lineWidth = 5.5; ctx.globalAlpha = .92; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x, b.y, 3.4, 0, Math.PI*2); ctx.fillStyle = C.zhu; ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 印
  const blink = p.iframe > 0 && Math.floor(p.iframe*18) % 2 === 0;
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(p.tilt - 0.06);
  ctx.globalAlpha = blink ? .35 : 1;
  ctx.fillStyle = C.zhu;
  rrect(-13, -13, 26, 26, 5); ctx.fill();
  ctx.fillStyle = 'rgba(244,239,226,.92)';
  ctx.font = '700 15px "Noto Serif TC","Songti TC",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('印', 0, 1);
  ctx.globalAlpha = 1;
  ctx.restore();

  // 碎墨
  for (const m of motes){
    const k = 1 - m.t/m.life;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r*k, 0, Math.PI*2);
    ctx.fillStyle = m.col; ctx.globalAlpha = k*0.8; ctx.fill(); ctx.globalAlpha = 1;
  }

  ctx.restore();
  drawHUD();
}

function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

function drawHUD(){
  if (state === 'menu') return;
  const pad = 18, w = Math.min(320, W - pad*2);

  // 生命
  ctx.fillStyle = 'rgba(27,26,23,.14)'; ctx.fillRect(pad, pad, w, 9);
  ctx.fillStyle = C.zhu; ctx.fillRect(pad, pad, w * Math.max(0, p.hp/p.maxHp), 9);
  // 墨（經驗）
  ctx.fillStyle = 'rgba(27,26,23,.14)'; ctx.fillRect(pad, pad+13, w, 5);
  ctx.fillStyle = C.ink; ctx.fillRect(pad, pad+13, w * Math.min(1, p.xp/p.need), 5);

  ctx.fillStyle = C.ink;
  ctx.font = '600 12px system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.globalAlpha = .62;
  ctx.fillText(`筆力 ${p.lv}　化墨 ${kills}`, pad, pad + 26);
  ctx.globalAlpha = 1;

  // 倒數
  ctx.font = '800 30px "Noto Serif TC","Songti TC",serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = C.ink;
  ctx.fillText(fmt(Math.max(0, GOAL - T)), W - pad, pad - 2);
  ctx.font = '600 11px system-ui,sans-serif';
  ctx.globalAlpha = .55;
  ctx.fillText('剩餘', W - pad, pad + 34);
  ctx.globalAlpha = 1;

  if (banner){
    const k = banner.t < 0.3 ? banner.t/0.3 : Math.max(0, 1 - (banner.t-0.3)/1.9);
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha = k;
    ctx.fillStyle = C.ink;
    ctx.font = '900 clamp(34px, 9vw, 58px) "Noto Serif TC","Songti TC",serif';
    ctx.fillText(banner.text, W/2, H*0.24);
    ctx.fillStyle = C.zhu;
    ctx.fillRect(W/2 - 44, H*0.24 + 40, 88, 3);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  if (paused){
    ctx.fillStyle = 'rgba(234,227,210,.72)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 42px "Noto Serif TC","Songti TC",serif';
    ctx.fillText('擱筆', W/2, H/2);
    ctx.font = '600 13px system-ui,sans-serif';
    ctx.globalAlpha = .6;
    ctx.fillText('按 Esc 續', W/2, H/2 + 34);
    ctx.globalAlpha = 1;
  }
}

// ─────────────────────────── 主迴圈 ───────────────────────────
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'play' && !paused) update(dt);
  if (state !== 'menu') draw();
  else { ctx.fillStyle = paperPat; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
})();
</script>
